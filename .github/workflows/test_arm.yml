name: Test on ARM

# Installs a released dynamic-font from PyPI on real ARM64 machines and runs
# scripts/smoke_test.py (renders every major feature headlessly and checks
# it). Nothing is built here: --only-binary makes pip use the published
# wheel for that platform, so a missing ARM wheel fails instead of silently
# compiling the sdist. Run it by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "dynamic-font version on PyPI"
        default: "1.2.4"
        required: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, windows-11-arm, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dynamic-font ${{ inputs.version }} + pygame-ce (wheels only)
        run: |
          python -m pip install --only-binary=:all: "dynamic-font==${{ inputs.version }}" pygame-ce

      - name: Smoke test
        # Run from outside the checkout so "import dynamic_font" loads the
        # installed wheel, not the dynamic_font/ source folder.
        working-directory: ${{ runner.temp }}
        env:
          PYTHONIOENCODING: utf-8
        run: python "${{ github.workspace }}/scripts/smoke_test.py" --out smoke-${{ matrix.os }}-py${{ matrix.python }}.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}-py${{ matrix.python }}
          path: ${{ runner.temp }}/smoke-*.png
