name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # --------------------------------------------------------------------
  # Windows needs its own job: FreeType must be built from source WITH
  # PNG support (build_all.bat) BEFORE cibuildwheel runs, since that
  # build uses CMake/MSVC directly and doesn't fit cibuildwheel's
  # per-wheel container "before-all" model the way Linux/macOS's simple
  # package-manager installs do.
  # --------------------------------------------------------------------
  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up host Python (cibuildwheel v3 requires 3.11+ to RUN it —
          separate from the target Python versions being built for)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC developer environment
        # arch stays x64 — this just sets up the base PATH for cl.exe/
        # cmake; CMake's own -A flag (used inside build_all.bat) picks
        # the right cross-compiler PER architecture (x64/x86/ARM64) at
        # configure time, as long as the "MSVC ARM64/ARM64EC build
        # tools" Visual Studio component is present on the runner. If
        # the ARM64 leg of build_all.bat fails with a "no compiler
        # found" style error, that component is the first thing to
        # check/install — this hasn't been verified as present-by-
        # -default on windows-latest.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # NOTE: a "Use the VS toolset actually present on this runner" step
      # used to live here, forcing GENERATOR=Visual Studio 17 2022 — that
      # was correct when this workflow was written, but windows-latest
      # migrated to Visual Studio 2026 by default in June 2026 (confirmed
      # via actions/runner-images' own release notes: "windows-latest...
      # will be migrated to use Visual Studio 2026 by default", completed
      # June 15 2026). Forcing the old VS2022 generator now made CMake
      # fail with "could not find any instance of Visual Studio", since
      # that toolset no longer exists on this image at all. Removed
      # entirely rather than hardcoding a new version number here too —
      # build_all.bat's own default (GENERATOR=Visual Studio 18 2026,
      # already confirmed working via a real local Windows build) now
      # matches windows-latest exactly, so no override is needed. If
      # GitHub bumps windows-latest to a newer VS again later, this again
      # needs no change here — only build_all.bat's own default would.

      - name: Build zlib -> libpng -> FreeType (with PNG)
        shell: cmd
        run: build_all.bat

      # MSVC has genuinely SEPARATE toolchains for each architecture —
      # confirmed via cibuildwheel's own docs ("MSVC has separate
      # toolchains for compiling 32-bit and 64-bit, so you will need to
      # run cibuildwheel twice: once... after setting up the x86 build
      # environment") and via ilammy/msvc-dev-cmd's own multi-arch
      # example. A single "arch: x64" setup at the top of this job
      # (as this workflow used to have) only configures the x64
      # toolchain — building x86/ARM64 wheels under it doesn't fail to
      # configure, but SILENTLY links against the wrong-bitness
      # libraries, producing hundreds of "unresolved external symbol"
      # errors covering even basic Python C-API symbols (confirmed via
      # a real failed build: 248 unresolved externals, spanning both
      # CPython's own API and FreeType's, on a wheel that built cleanly
      # once re-run with a correctly-scoped x86 toolchain below).
      # build_all.bat above only needs to run ONCE, regardless — it
      # already cross-builds all 3 architectures' static libs via
      # CMake's own -A flag, independent of which toolchain happens to
      # be active in PATH at that point.
      - name: Build AMD64 wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: AMD64
          FREETYPE_ROOT: ${{ github.workspace }}\freetype_src
          DEPS_ROOT: C:\deps

      - name: Set up MSVC developer environment for x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_x86

      - name: Build x86 wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: x86
          FREETYPE_ROOT: ${{ github.workspace }}\freetype_src
          DEPS_ROOT: C:\deps

      - name: Set up MSVC developer environment for ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      # ARM64 remains a known-risky leg regardless of this fix — it's
      # already documented above/elsewhere as "experimental" per
      # cibuildwheel itself, and needs the "MSVC ARM64/ARM64EC build
      # tools" Visual Studio component present on the runner (not
      # verified as present-by-default on windows-latest). If this step
      # fails while AMD64/x86 above succeeded, that's an independent,
      # known, accepted risk — not a sign the rest of this fix is wrong.
      - name: Build ARM64 wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
          CIBW_ARCHS: ARM64
          FREETYPE_ROOT: ${{ github.workspace }}\freetype_src
          DEPS_ROOT: C:\deps

      # Each of the 3 steps above writes into the SAME default
      # "wheelhouse" output-dir — the cibuildwheel action itself is a
      # thin `pipx run cibuildwheel ... --output-dir wheelhouse` call
      # (confirmed via its own action.yml) that never clears this
      # directory first, so wheels from each architecture accumulate
      # here rather than overwriting each other.
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: wheelhouse/*.whl

  # --------------------------------------------------------------------
  # Linux and macOS: FreeType (already PNG-enabled by the distro/brew
  # build) comes straight from the package manager — see the before-all
  # hooks in pyproject.toml's [tool.cibuildwheel.linux]/[.macos] sections.
  # No source build needed, so all three share one simple job via the
  # matrix.
  #
  # macOS is split into TWO separate runner labels rather than building
  # universal2 wheels: macos-15-intel (x86_64) and macos-latest (Apple
  # Silicon/arm64, the default architecture as of GitHub's current
  # runner images) — each has its OWN native Homebrew packages, so
  # `brew install freetype` just works with no cross-compilation. A
  # universal2 wheel would need a universal2 FreeType/libpng/zlib too,
  # which Homebrew does not reliably provide via a plain `brew install`.
  #
  # NOTE: GitHub retired the old macos-13 Intel runner label in Dec 2025
  # — macos-15-intel is its replacement, and is currently GitHub's last
  # planned x86_64 macOS image (Intel Macs are being phased out
  # industry-wide). If this label is later retired too, check
  # https://github.com/actions/runner-images for the current Intel
  # macOS label before re-running this workflow.
  # --------------------------------------------------------------------
  build_unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (Linux only — needed to cross-build aarch64
          wheels via emulation on this x86_64 runner; macOS handles its
          two architectures via separate native runner labels instead,
          so this step is a no-op there)
        if: matrix.os == 'ubuntu-latest'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up host Python (cibuildwheel v3 requires 3.11+ to RUN it —
          separate from the target Python versions being built for)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.2.1
        env:
           MACOSX_DEPLOYMENT_TARGET: "15.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # --------------------------------------------------------------------
  # Collects all platform wheels into a single GitHub Release attached
  # to the version tag that triggered this workflow.
  # --------------------------------------------------------------------
  publish_release:
    needs: [build_windows, build_unix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # Required for softprops/action-gh-release to create a Release —
    # GITHUB_TOKEN defaults to read-only on many repos (GitHub changed
    # this default a while back), so without this the release step can
    # fail with "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
