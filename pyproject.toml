[build-system]
requires = [
    "setuptools>=61.0",
    # Cython 3.3.0 officially dropped Python 3.8 support (confirmed via
    # its own changelog: "Support for Python 3.8 has been removed",
    # Python 3.8 having reached its own security-patch EOL in October
    # 2024). Without this split, pip would install the newest Cython for
    # EVERY target here — including cp38 — and the build-tool install
    # step itself would fail before ever reaching this project's code,
    # since Cython >=3.3.0 can't run under Python 3.8 to begin with.
    "cython<3.3.0; python_version < '3.9'",
    "cython>=3.3.0; python_version >= '3.9'",
]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-font"
version = "1.2.3"
description = "High-performance multi-script text/emoji rendering engine (Cython + embedded FreeType) for pygame"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
# pygame/pygame-ce intentionally excluded — users already have one of
# the two installed, and this project works with either; forcing a
# specific variant here would silently override that choice (this
# table takes priority over setup.py's own install_requires, per
# setuptools' pyproject.toml-first dependency resolution).
dependencies = [
    "uharfbuzz>=0.30.0",
]

[tool.cibuildwheel]
# Build for CPython 3.8-3.14. 32-bit Windows (win32) IS supported —
# pygame-ce itself still ships 32-bit Windows wheels, so this extension
# does too (see build_all.bat, which builds both x64 and x86 static
# libs). 32-bit Linux (manylinux_i686) is skipped separately below since
# it's a much rarer target with no equivalent upstream justification.
# (3.13/3.14 free-threaded variants are skipped separately below —
# this Cython codebase hasn't been designed/tested for no-GIL mode.)
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux* cp3??t-*"
build-verbosity = 1

[tool.cibuildwheel.linux]
# aarch64 needs QEMU emulation to build on the x86_64 GitHub runner —
# set up via docker/setup-qemu-action in the workflow before cibuildwheel
# runs. This roughly doubles Linux build time (QEMU emulation is
# noticeably slower than native), but covers real users on ARM servers
# (AWS Graviton etc.) and 64-bit Raspberry Pi OS.
archs = ["x86_64", "aarch64"]
# Debian/Ubuntu-based manylinux image already ships a PNG-enabled
# FreeType — install the -dev headers via the container's package
# manager before building (see setup.py's pkg-config fallback). This
# runs correctly under QEMU emulation too — apt/yum inside the
# manylinux container works the same regardless of host architecture.
# manylinux_2_28 images are a minimal AlmaLinux 8 build that only ships
# "dnf" — NOT "yum" as an alias (unlike a full AlmaLinux 8 install) and
# obviously not apt-get either (RHEL-based, not Debian). Confirmed via a
# real-world failure report hitting this exact issue: dnf must be tried
# FIRST, with yum/apt-get as fallbacks for other possible base images.
# The freetype-devel package on manylinux (AlmaLinux 8-based) is FreeType
# 2.9.1 (2018) — confirmed via AlmaLinux's own package repository — which
# predates FT_COLOR_H (added in 2.10.0+) entirely, needed for COLRv0/v1
# color emoji support. Installing it from the system package manager is
# therefore not an option here (unlike libpng, which the older system
# version is fine for) — FreeType must be built from source at a modern
# version, mirroring exactly what build_all.bat already does for Windows.
# Verified end-to-end on a real build: this exact source (GitHub mirror,
# same VER-2-13-3 tag used by build_all.bat) compiles clean and provides
# FT_COLOR_H, confirmed by successfully compiling the real _core.c against
# it after the system FreetType's version had failed on that exact symbol.
before-all = "(dnf install -y cmake git libpng-devel zlib-devel || yum install -y cmake git libpng-devel zlib-devel || (apt-get update && apt-get install -y cmake git libpng-dev zlib1g-dev)) && git clone -b VER-2-13-3 --depth 1 https://github.com/freetype/freetype.git /tmp/freetype_src && cmake -B /tmp/freetype_src/build -S /tmp/freetype_src -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DFT_REQUIRE_ZLIB=ON -DFT_REQUIRE_PNG=ON && cmake --build /tmp/freetype_src/build -j4 && cmake --install /tmp/freetype_src/build"

[tool.cibuildwheel.macos]
before-all = "brew install freetype libpng pkg-config"
# Homebrew's freetype/libpng on the current macOS runner are themselves
# built targeting macOS 14.0 (Sonoma) — cibuildwheel's own default wheel
# target is 10.9, far older, for broad compatibility. That mismatch is
# what delocate-wheel's repair step actually caught (confirmed via a
# real build failure: "Library dependencies do not satisfy target MacOS
# version 10.9... has a minimum target of 14.0"), not a bug in this
# project's own code. Setting this to match is the only viable fix
# without building freetype/libpng from source for macOS too (as
# already done for Windows/Linux) — the real, unavoidable tradeoff is
# that wheels built this way only install on macOS 14.0+; anyone on an
# older macOS would need to build from source instead of using pip's
# prebuilt wheel.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.cibuildwheel.windows]
# ARM64 here is cross-compiled from the SAME Intel (AMD64) runner —
# cibuildwheel supports this natively (no separate ARM64 runner needed),
# but this is officially labeled "experimental" by cibuildwheel itself,
# and has known failure reports from other projects (unresolved external
# symbols from linking against the wrong-architecture static libs) —
# expect this to need more debugging than the other architectures if it
# fails. build_all.bat builds FreeType/libpng/zlib for ALL THREE
# architectures (x64, x86, ARM64) so the right static libs are available
# whichever one cibuildwheel is currently building.
archs = ["AMD64", "x86", "ARM64"]
# Windows needs FreeType built from source WITH PNG support (see
# build_all.bat) — pip's own manylinux-style prebuilt FreeType wheels
# don't exist for this use case, since we statically link straight into
# the .pyd rather than depending on a separate DLL. build_all.bat must
# be run BEFORE cibuildwheel on this platform (see the GitHub Actions
# workflow, which does this as a separate step ahead of the cibuildwheel
# action, not through this before-all hook — CMake/MSVC builds like this
# don't fit cibuildwheel's per-wheel container model well).
before-all = "echo Windows deps are built by build_all.bat as a separate CI step, not here."
